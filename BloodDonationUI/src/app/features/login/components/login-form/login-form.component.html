<div class="container">
    <div class="login-container">
        <mat-card>
            <mat-card-header>
                <mat-card-title>Login</mat-card-title>
            </mat-card-header>

            <mat-card-content>
                <form>
                    <!-- Campo de Email -->
                    <mat-form-field appearance="fill">
                        <mat-label>Email</mat-label>
                        <input matInput placeholder="Digite seu email" type="email">
                    </mat-form-field>
                    <!-- Campo de Senha -->
                    <mat-form-field appearance="fill">
                        <mat-label>Senha</mat-label>
                        <input matInput placeholder="Digite sua senha" type="password">
                    </mat-form-field>

                    <!-- Botão de Login -->
                    <div class="login-button">
                        <button mat-raised-button color="primary" type="submit">Entrar</button>
                    </div>

                </form>
            </mat-card-content>
        </mat-card>
    </div>
</div>
